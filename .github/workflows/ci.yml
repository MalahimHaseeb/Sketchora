name: CI

on:
  pull_request:
  push:
    branches: [main, developer]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn prettier --check electron excalidraw-app/App.tsx excalidraw-app/types/electron.d.ts
      - run: yarn test:typecheck
      - run: yarn test:code
